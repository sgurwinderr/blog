baseURL = "https://sgurwinderr.com/"
languageCode = "en-us"
title = "AI & Graphics"
theme = "medium"
summaryLength = 25
copyright = "Gurwinder - All rights reserved"
enableEmoji = true

# Disable RSS feeds — keep only HTML + JSON (search index) for home.
# NOTE: do NOT list "Sitemap" on page kinds here. Hugo generates the
# site-wide /sitemap.xml automatically from its own sitemap kind; adding
# "Sitemap" to home/section/page instead renders the sitemap template
# per-page over an empty page set, producing an empty <urlset>.
[outputs]
  home     = ["HTML", "JSON"]
  section  = ["HTML"]
  taxonomy = ["HTML"]
  term     = ["HTML"]
  page     = ["HTML"]

[permalinks]
  post = "/:slug/"

# Google Analytics GA4
[services.googleAnalytics]
  id = "G-KD3KXHFEQM"

# Server cache headers (applied by Hugo dev server; mirror in your production web server)
[[server.headers]]
  for = "/**.css"
  [server.headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[server.headers]]
  for = "/**.js"
  [server.headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[server.headers]]
  for = "/assets/images/**"
  [server.headers.values]
    Cache-Control = "public, max-age=604800"

[pagination]
  pagerSize = 9

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  block = [["$$", "$$"]]
  inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
  style = "github-dark"
  lineNos = false
  noClasses = true
  tabWidth = 4

[params]
  logo = "/assets/images/logo.png"
  description = "GPU SDE | AI & Graphics @ Intel, Loves to Work on AI, Games & AR/VR"
  customCSS = ["/css/custom.css"]

[params.author]
  name = "Gurwinder"
  thumbnail = "assets/images/profile.jpg"
  description = "GPU SDE | AI & Graphics @ Intel, Loves to Work on AI, Games & AR/VR"

[params.index]
  picture = "assets/images/profile.jpg"
  title = "Gurwinder"
  subtitle = "GPU SDE | AI & Graphics @ Intel"
  mdtext = "I write about AI, Graphics, Game Development, and more."
  alertbar = false

[params.social]
  linkedin = "sgurwinderr"
  github = "sgurwinderr"

[params.seo]
  # Add your Google Search Console verification code here after setup
  # Get code from: https://search.google.com/search-console
  # googleSiteVerification = "YOUR_VERIFICATION_CODE"

## Main Menu — edit name/url here; remove an entry to hide it from the navbar
[[menu.main]]
    name = "Learn AI"
    weight = 150
    identifier = "learn-ai"
    url = "/learn-ai"

[[menu.main]]
    name = "PR Walkthroughs"
    weight = 200
    identifier = "pr-walkthroughs"
    url = "/pr-walkthroughs"

[[menu.main]]
    name = "About"
    weight = 600
    identifier = "about"
    url = "/about"

[[menu.main]]
    name = "Blog"
    weight = 100
    identifier = "blog"
    url = "/"