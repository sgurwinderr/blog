  <!-- Auto-link vLLM PR references (#NNNN) to GitHub. Runs once after load;
       walks text nodes only, so it never touches existing markup/attributes. -->
  <script defer>
    window.addEventListener('load', function () {
      var RE = /#(\d{3,6})\b/;
      var root = document.getElementById('main');
      if (!root) return;
      function prAnchor(num, cls) {
        var a = document.createElement('a');
        a.href = 'https://github.com/vllm-project/vllm/pull/' + num;
        a.target = '_blank'; a.rel = 'noopener';
        a.className = cls;
        a.textContent = '#' + num;
        return a;
      }
      // First: <code>#NNNN</code> that is ONLY a PR number → a linked code chip.
      Array.prototype.forEach.call(root.querySelectorAll('code'), function (code) {
        var m = /^#(\d{3,6})$/.exec(code.textContent.trim());
        if (!m) return;
        var a = prAnchor(m[1], 'pr-link');
        a.className = 'pr-link pr-code';
        code.textContent = '';
        code.appendChild(a);
      });
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: function (n) {
          if (!RE.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
          // skip anything already inside a link, code, or pre block
          var p = n.parentNode;
          while (p && p !== root) {
            var tag = p.nodeName;
            if (tag === 'A' || tag === 'CODE' || tag === 'PRE') return NodeFilter.FILTER_REJECT;
            p = p.parentNode;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var targets = [], n;
      while ((n = walker.nextNode())) targets.push(n);
      targets.forEach(function (node) {
        var parts = node.nodeValue.split(/(#\d{3,6}\b)/);
        if (parts.length < 2) return;
        var frag = document.createDocumentFragment();
        parts.forEach(function (part) {
          var m = /^#(\d{3,6})$/.exec(part);
          if (m) {
            var a = document.createElement('a');
            a.href = 'https://github.com/vllm-project/vllm/pull/' + m[1];
            a.target = '_blank'; a.rel = 'noopener';
            a.className = 'pr-link';
            a.textContent = part;
            frag.appendChild(a);
          } else if (part) {
            frag.appendChild(document.createTextNode(part));
          }
        });
        node.parentNode.replaceChild(frag, node);
      });
    });
  </script>
